name: Android host contract

on:
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: Hermes tag or commit (empty selects the latest stable release)
        required: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Select and install Hermes
        env:
          REQUESTED_REF: ${{ inputs.hermes_ref }}
        run: |
          set -euo pipefail
          ref="$REQUESTED_REF"
          if [ -z "$ref" ]; then
            ref=$(git ls-remote --tags --refs https://github.com/NousResearch/hermes-agent |
              sed 's#.*refs/tags/##' | grep -E '^v[0-9]{1,3}\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          case "$ref" in ''|-*) echo 'Invalid Hermes ref' >&2; exit 1 ;; esac
          printf '%s\n' "$ref" > "$RUNNER_TEMP/hermes-ref.txt"
          python -m pip install --quiet uv==0.11.32
          upstream/install-hermes.sh "$ref" "$RUNNER_TEMP/hermes"
      - name: Exercise real dashboard and plugin contracts
        run: |
          set -euo pipefail
          export HERMES_REF="$(cat "$RUNNER_TEMP/hermes-ref.txt")"
          export HERMES_BIN="$RUNNER_TEMP/hermes/.venv/bin/hermes"
          # These three modules start their own backend. Hermes' machine-level
          # host lease refuses a second backend while the shared session fixture
          # is alive, even with another HERMES_HOME. Retire it between processes.
          result=0
          "$RUNNER_TEMP/hermes/.venv/bin/python" -m pytest --rootdir=upstream upstream \
            --ignore=upstream/test_bot_work.py --ignore=upstream/test_compaction_skip.py \
            --ignore=upstream/test_cron_bot_chat.py \
            -rfEsxX -p no:cacheprovider --junitxml="$RUNNER_TEMP/android-host-contract.xml" || result=1
          for module in test_bot_work test_compaction_skip test_cron_bot_chat; do
            "$RUNNER_TEMP/hermes/.venv/bin/python" -m pytest --rootdir=upstream "upstream/$module.py" \
              -rfEsxX -p no:cacheprovider --junitxml="$RUNNER_TEMP/android-host-$module.xml" || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-host-contract
          path: |
            ${{ runner.temp }}/hermes-ref.txt
            ${{ runner.temp }}/android-host-*.xml
          if-no-files-found: ignore
